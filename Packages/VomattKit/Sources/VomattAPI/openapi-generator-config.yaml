generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# The app never calls the admin endpoints. The filter only includes, so the Auth operations are
# listed one by one to leave out the admin console's sign-in (adminSendOtp, adminVerifyOtp,
# adminPasskeyLoginVerify). Community Account is listed the same way: the app has only what an invitee
# needs (their communities, and reading and answering an invitation), not managing an account or acting as one
filter:
  operations:
    - acceptInvitation
    - appleLogin
    - declineInvitation
    - getInvitation
    - googleLogin
    - lineLogin
    - listMine
    - logout
    - passkeyLoginOptions
    - passkeyLoginVerify
    - phoneSendOtp
    - phoneVerifyOtp
    - refresh
    - registrationOptions
    - sendOtp
    - verifyOtp
    - verifyRegistration
  tags:
    - Vote
    - Vote Comment
    - Notification
    - Invite List
    - User
    - Tag
    - Lookup
    - Feedback
